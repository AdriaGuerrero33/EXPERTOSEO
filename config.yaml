# ============================================================
# EXPERTOSEO - Configuración Principal
# ============================================================

# --- Sitios WordPress ---
sites:
  - name: "Reseñas Premium"
    slug: "SITE1"                          # WP_APP_PASSWORD_SITE1 en Railway Variables
    url: "https://resenaspremium.com"
    wp_user: ""                            # Sobreescrito por WP_USERNAME_SITE1 en Railway Variables
    default_category: "SEO"
    default_author_id: 1
    language: "es"
    timezone: "Europe/Madrid"
    gsc_property: "https://resenaspremium.com"    # Propiedad en Google Search Console
    competitors:
      - "https://trustpilot.com"
      - "https://reseñas.es"

# --- Programación automática ---
schedule:
  interval_days: 2                         # Publicar cada 2 días
  publish_time: "09:00"                    # Hora de publicación (formato HH:MM)
  timezone: "Europe/Madrid"
  active_site: "SITE1"                     # Sitio activo para publicación automática
  publish_status: "publish"                # "publish" o "draft"

# --- Keywords ---
keywords:
  niche: "reseñas productos online"        # Nicho principal para tendencias
  manual:
    - "reseñas productos amazon"
    - "opiniones productos tecnologia"
    - "mejores productos calidad precio"
    - "comparativa productos 2025"
  # Las keywords de GSC y Google Trends se añaden automáticamente

# --- Configuración SEO ---
seo:
  min_words: 1500
  max_words: 2500
  min_score: 70                            # Score mínimo para publicar (0-100)
  keyword_density_min: 0.8                 # % mínimo
  keyword_density_max: 2.0                 # % máximo
  language: "es"
  country: "es"                            # Para SERP y tendencias

# --- Generación de imágenes ---
images:
  provider: "unsplash"                 # "unsplash" (gratis) o "dalle" (requiere OpenAI)
  dalle_model: "dall-e-3"
  dalle_quality: "standard"
  dalle_size: "1792x1024"
  optimize_width: 1200
  optimize_height: 630
  format: "webp"

# --- Modelos AI ---
ai:
  article_model: "claude-sonnet-4-6"
  assistant_model: "claude-sonnet-4-6"
  max_tokens_article: 8000
  max_tokens_assistant: 4000
